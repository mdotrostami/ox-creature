name: Self Build Loop

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [self-build-next]

permissions:
  contents: write
  actions: write

concurrency:
  group: ox-creature-self-build
  cancel-in-progress: false

jobs:
  self-build:
    runs-on: ubuntu-latest
    env:
      CREATURE_LLM_BASE_URL: https://api.gapgpt.app/v1
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git actor
        shell: bash
        run: |
          git config user.name "ox-creature"
          git config user.email "actions@github.com"

      - name: Preflight
        shell: bash
        run: |
          cargo fmt --all --check
          cargo test
          cargo run -- preflight-check

      - name: Read self-build delay
        shell: bash
        run: |
          delay="$(cargo run --quiet -- self-build-rate-seconds)"
          echo "SELF_BUILD_DELAY_SECONDS=${delay}" >> "$GITHUB_ENV"

      - name: Emit self-build context
        shell: bash
        run: |
          mkdir -p state
          cargo run -- self-build-context --json > state/self-build-context.json

      - name: Ask LLM for one task-scoped mutation
        shell: bash
        run: |
          rm -f state/llm-next-action.json state/llm-action-error.txt state/llm-response.json state/llm-request.json
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo "LLM_API_KEY secret is missing" > state/llm-action-error.txt
            exit 0
          fi
          base="${CREATURE_LLM_BASE_URL%/}"
          if ! curl -fsS "$base/models" -H "Authorization: Bearer $LLM_API_KEY" > state/llm-models.json; then
            echo "model discovery failed" > state/llm-action-error.txt
            exit 0
          fi
          model="$(python3 -c 'import json; data=json.load(open("state/llm-models.json")); models=[m.get("id","") for m in data.get("data",[]) if isinstance(m,dict)]; preferred=[m for m in models if "qwen" in m.lower() or "coder" in m.lower()]; print((preferred or models or [""])[0])')"
          if [ -z "$model" ]; then
            echo "model discovery returned no model id" > state/llm-action-error.txt
            exit 0
          fi
          MODEL="$model" python3 -c 'import json, os; ctx=open("state/self-build-context.json").read(); req={"model":os.environ["MODEL"],"temperature":0.2,"messages":[{"role":"system","content":"You are ox-creature self-build. Return exactly one JSON object matching contracts/llm-next-action.schema.json. No markdown. Complete only the current task."},{"role":"user","content":ctx}]}; print(json.dumps(req))' > state/llm-request.json
          if ! curl -fsS "$base/chat/completions" -H "Authorization: Bearer $LLM_API_KEY" -H "Content-Type: application/json" --data @state/llm-request.json > state/llm-response.json; then
            echo "chat completion failed" > state/llm-action-error.txt
            exit 0
          fi
          if ! cargo run -- llm-action-from-response state/llm-response.json state/llm-next-action.json > state/llm-action-extract.log 2>&1; then
            cp state/llm-action-extract.log state/llm-action-error.txt
            exit 0
          fi

      - name: Apply one governed self-build step
        shell: bash
        run: |
          if [ -f state/llm-next-action.json ]; then
            cargo run -- self-build-step --action state/llm-next-action.json --json > state/self-build-result.stdout.json
          else
            cargo run -- self-build-step --json > state/self-build-result.stdout.json
          fi
          cat state/self-build-result.stdout.json

      - name: Commit self-build result
        shell: bash
        run: |
          python3 -c 'import json, os, subprocess; data=json.load(open("state/self-build-result.json")); files=list(dict.fromkeys(data.get("changed_files",[])+["state/self-build-result.json"])); files=[f for f in files if os.path.exists(f)]; subprocess.run(["git","add","--"]+files, check=True) if files else None'
          if git diff --cached --quiet; then
            echo "No self-build changes to commit."
          else
            message="$(python3 -c 'import json; print(json.load(open("state/self-build-result.json"))["commit_message"])')"
            git commit -m "$message"
            git push origin HEAD:main
          fi

      - name: Continue or request Judgment Day
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          should_continue="$(python3 -c 'import json; print(str(json.load(open("state/self-build-result.json")).get("should_continue", False)).lower())')"
          ready="$(python3 -c 'import json; print(str(json.load(open("state/self-build-result.json")).get("ready_for_judgment", False)).lower())')"
          delay="$(python3 -c 'import json; print(int(json.load(open("state/self-build-result.json")).get("delay_seconds", 0)))')"
          if [ "$ready" = "true" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/judgment-day.yml/dispatches" \
              -d '{"ref":"main"}'
            exit 0
          fi
          if [ "$should_continue" = "true" ]; then
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/self-loop.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
