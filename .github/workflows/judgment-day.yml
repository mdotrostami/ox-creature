name: Judgment Day

on:
  workflow_dispatch:
  repository_dispatch:
    types: [creature.judgment_day.requested]

permissions:
  contents: read

env:
  CREATURE_LLM_BASE_URL: https://api.gapgpt.app/v1

jobs:
  judgment:
    name: Judgment Day checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout creature
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        run: |
          cargo fmt --all --check
          cargo check
          cargo test
          cargo run -- preflight-check

      - name: Verify creature declared readiness
        run: cargo run -- self-build-ready-check

      - name: Produce Judgment Day report
        shell: bash
        run: |
          mkdir -p judgment-report
          {
            echo "# ox-creature Judgment Day Report"
            echo ""
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Ref: ${GITHUB_REF}"
            echo "SHA: ${GITHUB_SHA}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## Meaning"
            echo "Judgment Day is not the self-build loop."
            echo "It is requested only when the creature declares that it can transform a user story into code and expose proof to Cockpit."
            echo ""
            echo "## Creator action"
            echo "If every check passed, the creator may approve or reject from the GitHub environment gate."
          } > judgment-report/JUDGMENT_DAY_REPORT.md
          cargo run -- status --json > judgment-report/cockpit-status.json

      - name: Upload Judgment Day report
        uses: actions/upload-artifact@v4
        with:
          name: judgment-day-report
          path: judgment-report

  creator-gate:
    name: Creator judgment gate
    needs: judgment
    runs-on: ubuntu-latest
    environment: creator-judgment
    steps:
      - name: Await creator verdict
        run: |
          echo "Creator approved Judgment Day gate from GitHub UI."
